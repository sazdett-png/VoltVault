<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltVault Tool Tracker</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mainbg: '#121212',
                        cardbg: '#1e1e1e',
                        border: '#2c2c2c',
                        milwaukee: '#da291c',
                        klein: '#f47920',
                        textmuted: '#888888',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.mainbg');
            color: #ffffff;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.mainbg'); 
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.border'); 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.klein'); 
        }

        .input-field {
            background-color: theme('colors.mainbg');
            border: 1px solid theme('colors.border');
            color: white;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: theme('colors.klein');
            box-shadow: 0 0 0 1px theme('colors.klein');
        }
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .accordion-content {
            display: none;
        }
        .accordion-content.open {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        .accordion-icon {
            transition: transform 0.3s ease;
        }
        .accordion-icon.open {
            transform: rotate(180deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Fix for iOS input zoom */
        input[type="date"], input[type="text"], input[type="number"] {
            -webkit-appearance: none;
            font-size: 16px; 
        }
    </style>
</head>
<body class="min-h-screen py-4 px-3 sm:py-6 sm:px-6 lg:px-8 flex justify-center relative">

    <div id="loading-overlay" class="fixed inset-0 bg-mainbg/90 z-[100] flex flex-col items-center justify-center transition-opacity duration-300 backdrop-blur-sm">
        <svg class="animate-spin h-12 w-12 text-klein mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-textmuted font-mono text-sm animate-pulse tracking-widest uppercase font-bold">Синхронизация с облаком...</p>
    </div>

    <div class="w-full max-w-5xl flex flex-col gap-6">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-cardbg p-5 rounded-xl border-t-4 border-milwaukee shadow-xl gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight uppercase flex items-center gap-2">
                    <svg class="w-6 h-6 text-milwaukee" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    VoltVault Tracker
                </h1>
                <p class="text-textmuted mt-1 text-xs font-medium">Telegram Cloud Storage</p>
            </div>
            <div class="w-full sm:w-auto text-left sm:text-right bg-mainbg p-3 rounded-lg border border-border">
                <p class="text-[10px] text-textmuted uppercase tracking-wider font-bold mb-1">Всего потрачено</p>
                <p class="text-xl font-mono font-black text-klein" id="grand-total">$0.00</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start pb-10">
            
            <div class="lg:col-span-1 lg:sticky lg:top-6">
                <div class="bg-cardbg p-5 rounded-xl shadow-lg border border-border">
                    <h2 class="text-sm font-bold uppercase mb-4 border-b border-border pb-3 flex items-center gap-2 text-white">
                        <svg class="w-4 h-4 text-klein" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Добавить инструмент
                    </h2>
                    
                    <form id="add-tool-form" class="space-y-4">
                        <div>
                            <label class="block text-[11px] text-textmuted font-bold uppercase tracking-wide mb-1.5" for="tool-name">Название инструмента *</label>
                            <input type="text" id="tool-name" required placeholder="Например: M18 Fuel Drill" class="w-full px-3 py-2.5 rounded-md input-field text-sm">
                        </div>
                        
                        <div>
                            <label class="block text-[11px] text-textmuted font-bold uppercase tracking-wide mb-1.5" for="tool-desc">Описание (опционально)</label>
                            <input type="text" id="tool-desc" placeholder="Где купил, номер модели..." class="w-full px-3 py-2.5 rounded-md input-field text-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] text-textmuted font-bold uppercase tracking-wide mb-1.5" for="tool-price">Цена до налога *</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-textmuted text-sm">$</span>
                                    <input type="number" id="tool-price" required step="0.01" min="0" placeholder="0.00" class="w-full pl-7 pr-3 py-2.5 rounded-md input-field text-sm font-mono font-bold text-white">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] text-textmuted font-bold uppercase tracking-wide mb-1.5" for="tool-date">Дата *</label>
                                <input type="date" id="tool-date" required class="w-full px-3 py-2.5 rounded-md input-field text-sm font-mono [color-scheme:dark]">
                            </div>
                        </div>
                        
                        <p class="text-[10px] text-klein mt-1 font-mono flex items-center gap-1 bg-klein/10 p-2 rounded border border-klein/20">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            + 5% налог (AB) применится автоматически
                        </p>

                        <button type="submit" id="submit-btn" class="w-full mt-2 bg-border hover:bg-klein border border-border hover:border-klein text-white font-bold py-3 px-4 rounded-md transition-all duration-200 flex justify-center items-center gap-2 uppercase tracking-wide text-xs shadow-md">
                            Сохранить
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-cardbg p-4 sm:p-5 rounded-xl shadow-lg border border-border min-h-[400px]">
                    <div class="flex justify-between items-center mb-4 border-b border-border pb-3">
                        <h2 class="text-sm font-bold uppercase flex items-center gap-2 text-white">
                            <svg class="w-4 h-4 text-milwaukee" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            Архив покупок
                        </h2>
                    </div>
                    
                    <div id="months-container" class="space-y-3">
                        <!-- Content dynamically injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-cardbg border-t-4 border-milwaukee p-6 rounded-xl shadow-2xl max-w-sm w-full">
            <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-milwaukee" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Удаление
            </h3>
            <p class="text-textmuted mb-6 text-sm">Удалить этот инструмент из облака? Это действие нельзя отменить.</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-mainbg hover:bg-border text-white rounded-md text-xs font-medium border border-border transition-colors uppercase">Отмена</button>
                <button id="confirm-delete-btn" onclick="confirmDelete()" class="px-4 py-2 bg-milwaukee hover:bg-red-700 text-white rounded-md text-xs font-bold transition-colors shadow-lg shadow-red-900/50 flex items-center gap-2 uppercase">
                    Удалить
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // State Variables
        const STORAGE_KEY = 'voltVaultData';
        let tools = [];
        let openMonths = new Set();
        let toolToDeleteId = null;

        // DOM Elements
        const form = document.getElementById('add-tool-form');
        const nameInput = document.getElementById('tool-name');
        const descInput = document.getElementById('tool-desc');
        const priceInput = document.getElementById('tool-price');
        const dateInput = document.getElementById('tool-date');
        const submitBtn = document.getElementById('submit-btn');
        
        const monthsContainer = document.getElementById('months-container');
        const grandTotalEl = document.getElementById('grand-total');
        const modal = document.getElementById('delete-modal');
        const loadingOverlay = document.getElementById('loading-overlay');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

        const monthNames = [
            "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", 
            "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
        ];

        // UI Helpers
        function showLoading() {
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
        }

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }

        function formatDateStr(dateStr) {
            const parts = dateStr.split('-');
            if(parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        function loadData() {
            showLoading();
            tg.CloudStorage.getItem(STORAGE_KEY, (err, saved) => {
                if (err) {
                    console.error("Cloud load error:", err);
                    tools = [];
                } else if (saved) {
                    try {
                        tools = JSON.parse(saved);
                    } catch (e) {
                        console.error("JSON parse error:", e);
                        tools = [];
                    }
                } else {
                    tools = [];
                }
                
                // Open the most recent month by default if empty
                if (tools.length > 0 && openMonths.size === 0) {
                    const latestDate = tools.reduce((latest, tool) => {
                        return tool.date > latest ? tool.date : latest;
                    }, '2000-01-01');
                    openMonths.add(latestDate.substring(0, 7));
                }
                
                renderUI();
                hideLoading();
            });
        }

        function saveData(callback) {
            const dataString = JSON.stringify(tools);
            tg.CloudStorage.setItem(STORAGE_KEY, dataString, (err, success) => {
                if (err) console.error("Cloud save error:", err);
                renderUI();
                if (callback) callback();
            });
        }

        function renderUI() {
            let grandTotal = 0;
            const groupedByMonth = {};

            tools.forEach(tool => {
                // Safeguard against missing finalPrice in legacy corrupted data
                const actualPrice = tool.finalPrice !== undefined ? tool.finalPrice : (tool.price * 1.05);
                grandTotal += actualPrice;
                
                const monthKey = tool.date.substring(0, 7); // 'YYYY-MM'
                
                if (!groupedByMonth[monthKey]) {
                    const parts = monthKey.split('-');
                    const year = parts[0];
                    const monthIdx = parseInt(parts[1], 10) - 1;
                    
                    groupedByMonth[monthKey] = {
                        label: `${monthNames[monthIdx]} ${year}`,
                        total: 0,
                        items: []
                    };
                }
                
                groupedByMonth[monthKey].items.push(tool);
                groupedByMonth[monthKey].total += actualPrice;
            });

            grandTotalEl.textContent = formatCurrency(grandTotal);
            monthsContainer.innerHTML = '';

            const sortedMonthKeys = Object.keys(groupedByMonth).sort().reverse();

            if (sortedMonthKeys.length === 0) {
                monthsContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-10 text-textmuted gap-3 bg-mainbg rounded border border-border border-dashed">
                        <svg class="w-10 h-10 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <p class="text-xs font-medium uppercase tracking-wider">База пуста</p>
                    </div>
                `;
                return;
            }

            sortedMonthKeys.forEach(key => {
                const group = groupedByMonth[key];
                group.items.sort((a, b) => new Date(b.date) - new Date(a.date));

                const monthBlock = document.createElement('div');
                monthBlock.className = 'bg-mainbg border border-border rounded-lg overflow-hidden transition-all';
                
                const isOpen = openMonths.has(key);
                const contentClass = isOpen ? 'accordion-content open' : 'accordion-content';
                const iconClass = isOpen ? 'accordion-icon open' : 'accordion-icon';

                let toolsHtml = '';
                group.items.forEach(tool => {
                    const actualPrice = tool.finalPrice !== undefined ? tool.finalPrice : (tool.price * 1.05);
                    const descHtml = tool.desc ? `<p class="text-xs text-textmuted mt-1 leading-tight max-w-[200px] truncate">${tool.desc}</p>` : '';
                    
                    toolsHtml += `
                        <div class="flex justify-between items-center p-3 border-b border-cardbg last:border-0 hover:bg-cardbg transition-colors group">
                            <div class="flex-1 pr-3 overflow-hidden">
                                <h4 class="text-white font-semibold text-sm truncate">${tool.name}</h4>
                                ${descHtml}
                                <span class="text-[10px] text-textmuted font-mono mt-1.5 block">${formatDateStr(tool.date)}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <span class="font-mono text-sm font-black text-klein block">${formatCurrency(actualPrice)}</span>
                                    <span class="text-[9px] text-textmuted uppercase tracking-wide block mt-0.5">вкл. 5%</span>
                                </div>
                                <button onclick="openDeleteModal('${tool.id}', event)" class="text-border hover:text-milwaukee transition-colors p-1.5 rounded-md hover:bg-cardbg" title="Удалить">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });

                monthBlock.innerHTML = `
                    <button class="w-full flex justify-between items-center p-3.5 bg-cardbg hover:bg-[#252525] transition-colors text-left border-l-2 border-transparent hover:border-klein" onclick="toggleMonth('${key}')">
                        <div class="flex items-center gap-2">
                            <h3 class="text-white font-bold tracking-wide uppercase text-xs sm:text-sm">${group.label}</h3>
                            <span class="bg-mainbg text-textmuted text-[10px] px-1.5 py-0.5 rounded border border-border font-mono">${group.items.length}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-mono font-bold text-white text-sm">${formatCurrency(group.total)}</span>
                            <svg class="w-4 h-4 text-textmuted ${iconClass}" id="icon-${key}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </button>
                    <div class="${contentClass}" id="content-${key}">
                        <div>
                            ${toolsHtml}
                        </div>
                    </div>
                `;
                monthsContainer.appendChild(monthBlock);
            });
        }

        window.toggleMonth = function(key) {
            const content = document.getElementById(`content-${key}`);
            const icon = document.getElementById(`icon-${key}`);
            
            if (openMonths.has(key)) {
                openMonths.delete(key);
                content.classList.remove('open');
                icon.classList.remove('open');
            } else {
                openMonths.add(key);
                content.classList.add('open');
                icon.classList.add('open');
                try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
            }
        };

        window.openDeleteModal = function(id, event) {
            event.stopPropagation();
            toolToDeleteId = id;
            modal.classList.remove('hidden');
            try { tg.HapticFeedback.notificationOccurred('warning'); } catch(e){}
        };

        window.closeModal = function() {
            toolToDeleteId = null;
            modal.classList.add('hidden');
        };

        window.confirmDelete = function() {
            if (toolToDeleteId) {
                const originalText = confirmDeleteBtn.innerHTML;
                confirmDeleteBtn.innerHTML = '<svg class="animate-spin h-3 w-3 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
                confirmDeleteBtn.disabled = true;

                tools = tools.filter(t => t.id !== toolToDeleteId);
                
                saveData(() => {
                    closeModal();
                    confirmDeleteBtn.innerHTML = originalText;
                    confirmDeleteBtn.disabled = false;
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
                });
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            const desc = descInput.value.trim();
            const price = parseFloat(priceInput.value);
            const date = dateInput.value;

            if (name && !isNaN(price) && date) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

                const finalPrice = price * 1.05;

                const newTool = {
                    id: Date.now().toString() + Math.random().toString(36).substring(2, 9),
                    name: name,
                    desc: desc,
                    price: price,
                    finalPrice: finalPrice,
                    date: date
                };

                tools.push(newTool);
                
                const monthKey = date.substring(0, 7);
                openMonths.add(monthKey);
                
                saveData(() => {
                    nameInput.value = '';
                    descInput.value = '';
                    priceInput.value = '';
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Сохранить';
                    
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
                    
                    nameInput.blur();
                    descInput.blur();
                    priceInput.blur();
                });
            }
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            try { tg.ready(); } catch(e) {}

            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today.getTime() - offset)).toISOString().split('T')[0];
            dateInput.value = localISOTime;
            
            loadData();
        });
    </script>
</body>
</html>
